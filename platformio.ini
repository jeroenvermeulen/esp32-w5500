; PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lolin_s2_mini

[env]
; espressif32 8.x ships Arduino-ESP32 core 3.3.x, which has native W5500
; support in ETH.h (lwIP-integrated, works with the standard network APIs).
platform = espressif32 @ 8.0.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; No OTA: a single 3 MB app partition instead of two 1.25 MB ones.
board_build.partitions = huge_app.csv
; Strip the Arduino core's log messages.
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps =
    knolleary/PubSubClient @ 2.8

[env:lolin_s2_mini]
; WEMOS LOLIN S2 Mini: ESP32-S2 with native USB (CDC serial on boot).
board = lolin_s2_mini
